const u=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
async function open_(p){
 const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveKey']);
 const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.s),iterations:200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
 const t=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.i)},k,u(D.d));
 const m=document.getElementById('doc');m.innerHTML=new TextDecoder().decode(t)+'';
 m.querySelectorAll('.tw').forEach(w=>{const h=document.createElement('p');h.className='hint';h.textContent='表は横にスクロールできます';w.before(h)});
 m.hidden=false;document.getElementById('gate').remove();
}
document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const p=document.getElementById('pw').value.trim();
 try{await open_(p);try{sessionStorage.setItem('opk',p)}catch(_){}}catch(_){document.getElementById('err').textContent='パスコードが違います'}});
try{const p=sessionStorage.getItem('opk');if(p)open_(p).catch(()=>{})}catch(_){}
</script></body></html>
